name: Feature request
description: Suggest a Markdown structure, a typographic rule, or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to typeset, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: Example Markdown and the LaTeX you expect help a lot.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
